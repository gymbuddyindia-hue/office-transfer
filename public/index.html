<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Transfer</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232563eb'/%3E%3Cpath d='M16 8v12M10 14l6-6 6 6' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="dot"></span><span id="brandName">Office Transfer</span></a>
    <nav><a href="#recent">Recent</a></nav>
  </header>
  <main>
    <div style="width:100%">
    <section class="card" id="composer">
      <div class="error" id="error"></div>
      <div class="notice hidden" id="resumeNotice"></div>
      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Add files">
        <div class="plus">+</div>
        <strong>Add files</strong>
        <div class="muted">Drag and drop, or click to choose. No size limit.</div>
        <div class="alt muted">Or <button type="button" id="pickFolder">select a folder</button></div>
        <input type="file" id="fileInput" multiple hidden>
        <input type="file" id="folderInput" webkitdirectory multiple hidden>
      </div>
      <ul class="files" id="fileList"></ul>
      <div class="summary hidden" id="summary"><span id="fileCount"></span><span id="totalSize"></span></div>

      <div class="field" id="recipientsField">
        <label for="recipients">Email to</label>
        <input type="text" id="recipients" placeholder="colleague@company.com, another@company.com" autocomplete="off">
        <span class="muted" id="emailHint"></span>
      </div>
      <div class="field">
        <label for="senderEmail">Your email</label>
        <input type="email" id="senderEmail" placeholder="you@company.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="What is this?" maxlength="200">
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Optional note for the recipient" maxlength="5000"></textarea>
      </div>
      <details class="options">
        <summary>Options: expiry, password</summary>
        <div>
          <div class="row">
            <div class="field">
              <label for="expiry">Link expires</label>
              <select id="expiry">
                <option value="1">1 day</option>
                <option value="3">3 days</option>
                <option value="7">7 days</option>
                <option value="14">14 days</option>
                <option value="30">30 days</option>
                <option value="90">90 days</option>
                <option value="0">Never</option>
              </select>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Optional" autocomplete="new-password">
            </div>
          </div>
        </div>
      </details>
      <div class="field hidden" id="uploadCodeField">
        <label for="uploadCode">Staff upload code</label>
        <input type="password" id="uploadCode" placeholder="Ask your admin" autocomplete="off">
      </div>
      <button class="btn block" id="send" disabled>Transfer</button>
    </section>

    <section class="card hidden" id="progressCard">
      <div class="progress">
        <div class="ring" id="ring"><span id="percent">0%</span></div>
        <h2 id="progressTitle">Uploading</h2>
        <div class="stat" id="progressStat"></div>
        <div class="stat" id="progressFile"></div>
      </div>
      <ul class="files" id="progressList"></ul>
      <div class="error" id="progressError"></div>
      <div class="actions">
        <button class="btn secondary" id="retry" style="display:none">Retry</button>
        <button class="btn danger" id="cancel">Cancel</button>
      </div>
    </section>

    <section class="card hidden" id="doneCard">
      <div class="done">
        <div class="check">&#10003;</div>
        <h1>You're done</h1>
        <p class="muted" id="doneSummary"></p>
        <div class="linkbox">
          <input type="text" id="doneLink" readonly>
          <button class="btn small" id="copy">Copy link</button>
        </div>
        <p class="muted" id="doneEmail"></p>
        <div class="qr" id="qr"></div>
        <p class="muted" id="doneExpiry"></p>
        <div class="actions">
          <a class="btn secondary small" id="openLink" target="_blank" rel="noopener">Open download page</a>
          <button class="btn secondary small" id="another">Send another</button>
          <button class="btn danger small" id="deleteDone">Delete transfer</button>
        </div>
      </div>
    </section>

    <section class="recent" id="recent">
      <h2>Your recent transfers (this browser only)</h2>
      <ul id="recentList"></ul>
    </section>
    </div>
  </main>
  <footer>Self-hosted. Files stay on your own server.</footer>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
